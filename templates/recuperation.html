{% extends "base.html" %}

{% block content %}
<div class="glass-card">
    <div class="card-header">
        <h2>🏠 RÉCUPÉRATION DE COLIS</h2>
        <p style="font-size: 13px; color: #64748b; margin-top: 6px;">Recherchez et gérez les colis en attente de récupération</p>
    </div>
    <div class="card-body">
        
        <!-- Barre de recherche -->
        <div class="search-container">
            <input type="tel" id="searchPhone" placeholder="Entrez le numéro de téléphone du destinataire" style="flex: 1; padding: 14px 18px; border: 1.5px solid #e2e8f0; border-radius: 16px; font-size: 16px;">
            <button class="btn btn-primary" onclick="rechercherColis()" style="padding: 14px 24px;">🔍 RECHERCHER</button>
        </div>
        
        <!-- Liste des colis en attente -->
        <div style="margin-top: 30px;">
            <h3 style="font-size: 16px; margin-bottom: 15px;">📦 Colis en attente de récupération</h3>
            <div id="listeAttente"></div>
        </div>
        
        <!-- Résultats de recherche -->
        <div id="resultatsRecherche" style="margin-top: 20px;"></div>
        
    </div>
</div>

<!-- MODAL DE RÉCUPÉRATION -->
<div id="modalRecup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 24px; width: 90%; max-width: 450px; overflow: hidden;">
        <div style="padding: 20px; border-bottom: 1px solid #e2e8f0;">
            <h3 style="margin: 0;">🏠 CONFIRMER LA RÉCUPÉRATION</h3>
        </div>
        <div style="padding: 20px;">
            <div id="modalInfo" style="background: #f8fafc; padding: 12px; border-radius: 12px; margin-bottom: 20px;"></div>
            
            <div class="form-group">
                <label>💰 Montant payé (€) *</label>
                <input type="number" id="recupMontant" step="0.01" placeholder="0.00" style="width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px;">
            </div>
            
            <div class="form-group">
                <label>👤 Récupéré par</label>
                <input type="text" id="recupNom" placeholder="Nom de la personne qui récupère" style="width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px;">
            </div>
        </div>
        <div style="padding: 15px 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 12px; justify-content: flex-end;">
            <button onclick="fermerModal()" class="btn btn-secondary">Annuler</button>
            <button onclick="confirmerRecuperation()" class="btn btn-primary">✅ Confirmer</button>
        </div>
    </div>
</div>

<style>
    .colis-item {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        transition: all 0.2s;
    }
    .colis-item:hover {
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .colis-info {
        flex: 2;
    }
    .colis-info span {
        font-size: 13px;
        color: #64748b;
    }
    .colis-info strong {
        font-size: 15px;
        color: #1e293b;
    }
    .btn-recuperer {
        background: #e67e22;
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 40px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-recuperer:hover {
        background: #d35400;
        transform: scale(1.02);
    }
    .badge-attente {
        background: #fef3c7;
        color: #d97706;
        padding: 4px 12px;
        border-radius: 40px;
        font-size: 12px;
        font-weight: 500;
        display: inline-block;
        margin-right: 10px;
    }
    .type-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        margin-right: 8px;
    }
    .type-envoi {
        background: #dbeafe;
        color: #2563eb;
    }
    .type-reception {
        background: #fef3c7;
        color: #d97706;
    }
</style>

<script>
    let colisSelectionne = null;
    
    async function chargerColisEnAttente() {
        const response = await fetch('/api/colis/arrivants/en-attente');
        const colis = await response.json();
        
        const div = document.getElementById('listeAttente');
        
        if (colis.length === 0) {
            div.innerHTML = '<div style="padding: 20px; text-align: center; background: #f8fafc; border-radius: 16px;">✅ Aucun colis en attente</div>';
            return;
        }
        
        div.innerHTML = colis.map(c => {
            const typeTexte = c.type_flux === 'envoi_france' ? '📤 Envoi (CI→FR)' : '📥 Réception (FR→CI)';
            const typeClass = c.type_flux === 'envoi_france' ? 'type-envoi' : 'type-reception';
            return `
                <div class="colis-item">
                    <div class="colis-info">
                        <strong>#${c.id}</strong> - ${c.destinataire_nom || '-'}<br>
                        <span>${typeTexte} | 📞 ${c.destinataire_telephone || '-'} | 📦 ${c.type_colis || '-'} | 💰 ${c.prix_final || c.montant_paye || 0} €</span>
                    </div>
                    <div>
                        <span class="badge-attente">⏳ En attente</span>
                        <button class="btn-recuperer" onclick="ouvrirModal(${c.id}, ${c.prix_final || c.montant_paye || 0})">🏠 Récupéré</button>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    async function rechercherColis() {
        const phone = document.getElementById('searchPhone').value.trim();
        
        if (phone.length < 4) {
            document.getElementById('resultatsRecherche').innerHTML = '<div style="padding: 20px; text-align: center; background: #fef3c7; border-radius: 16px;">⚠️ Veuillez entrer au moins 4 chiffres</div>';
            return;
        }
        
        // Nettoyer le numéro (garder uniquement les chiffres)
        const phoneClean = phone.replace(/[\s\.\-+]/g, '');
        
        console.log("Recherche du numéro nettoyé:", phoneClean);
        
        try {
            // Utiliser l'API de recherche générale
            const response = await fetch(`/api/recherche?q=${encodeURIComponent(phoneClean)}`);
            const colis = await response.json();
            
            console.log("Colis trouvés:", colis);
            
            const div = document.getElementById('resultatsRecherche');
            
            // Filtrer uniquement les colis en attente
            const enAttente = colis.filter(c => c.statut === 'En attente');
            
            if (enAttente.length === 0) {
                div.innerHTML = `<div style="padding: 20px; text-align: center; background: #fee2e2; border-radius: 16px;">❌ Aucun colis en attente trouvé pour le numéro ${phone}</div>`;
                return;
            }
            
            div.innerHTML = enAttente.map(c => {
                const typeTexte = c.type_flux === 'envoi_france' ? '📤 Envoi (CI→FR)' : '📥 Réception (FR→CI)';
                const typeClass = c.type_flux === 'envoi_france' ? 'type-envoi' : 'type-reception';
                return `
                    <div class="colis-item" style="margin-top: 15px;">
                        <div class="colis-info">
                            <strong>#${c.id}</strong> - ${c.destinataire_nom || '-'}<br>
                            <span>${typeTexte} | 📞 ${c.destinataire_telephone || '-'} | 📦 ${c.type_colis || '-'} | 💰 ${c.prix_final || c.montant_paye || 0} €</span>
                        </div>
                        <div>
                            <span class="badge-attente">⏳ En attente</span>
                            <button class="btn-recuperer" onclick="ouvrirModal(${c.id}, ${c.prix_final || c.montant_paye || 0})">🏠 Marquer récupéré</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Rafraîchir la liste des colis en attente
            chargerColisEnAttente();
            
        } catch (error) {
            console.error("Erreur de recherche:", error);
            document.getElementById('resultatsRecherche').innerHTML = '<div style="padding: 20px; text-align: center; background: #fee2e2; border-radius: 16px;">❌ Erreur lors de la recherche</div>';
        }
    }
    
    function ouvrirModal(id, montant) {
        colisSelectionne = id;
        document.getElementById('recupMontant').value = montant;
        document.getElementById('recupNom').value = '';
        document.getElementById('modalRecup').style.display = 'flex';
        
        // Récupérer les infos du colis pour les afficher dans le modal
        fetch(`/api/colis/${id}`)
            .then(r => r.json())
            .then(c => {
                document.getElementById('modalInfo').innerHTML = `
                    <div><strong>Colis #${c.id}</strong></div>
                    <div>Destinataire: ${c.destinataire_nom || '-'}</div>
                    <div>Téléphone: ${c.destinataire_telephone || '-'}</div>
                    <div>Type: ${c.type_colis || '-'}</div>
                    <div>Montant à payer: <strong style="color:#e67e22;">${montant} €</strong></div>
                `;
            });
    }
    
    function fermerModal() {
        document.getElementById('modalRecup').style.display = 'none';
        colisSelectionne = null;
    }
    
    async function confirmerRecuperation() {
        const montant = parseFloat(document.getElementById('recupMontant').value);
        const nom = document.getElementById('recupNom').value;
        
        if (isNaN(montant) || montant <= 0) {
            alert('Veuillez entrer le montant payé');
            return;
        }
        
        try {
            const response = await fetch(`/api/colis/${colisSelectionne}/statut`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    statut: 'Récupéré',
                    montant_paye: montant,
                    recuperateur_nom: nom || null
                })
            });
            
            const result = await response.json();
            
            if (result.success) {
                alert('✅ Colis marqué comme récupéré !');
                fermerModal();
                document.getElementById('searchPhone').value = '';
                document.getElementById('resultatsRecherche').innerHTML = '';
                chargerColisEnAttente();
            } else {
                alert('❌ Erreur: ' + (result.message || 'Problème lors de la mise à jour'));
            }
        } catch (error) {
            console.error('Erreur:', error);
            alert('❌ Erreur lors de la communication avec le serveur');
        }
    }
    
    // Recherche avec la touche Entrée
    document.getElementById('searchPhone').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            rechercherColis();
        }
    });
    
    // Chargement initial
    chargerColisEnAttente();
</script>
{% endblock %}
