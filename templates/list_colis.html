{% extends "base.html" %}

{% block content %}
<div class="glass-card">
    <div class="card-header">
        <h2>📋 LISTE DES COLIS</h2>
        <p style="font-size: 13px; color: #64748b; margin-top: 6px;">Gérez tous vos colis (envois et réceptions)</p>
    </div>
    <div class="card-body">
        
        <!-- FILTRES -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
            <button class="filter-btn active" data-filter="all">📊 Tous</button>
            <button class="filter-btn" data-filter="envoi_france">📤 Envois (CI→FR)</button>
            <button class="filter-btn" data-filter="reception_france">📥 Réceptions (FR→CI)</button>
            <button class="filter-btn" data-filter="En attente">⏳ En attente</button>
            <button class="filter-btn" data-filter="Récupéré">✅ Récupéré</button>
            <button class="filter-btn" data-filter="Parti">✈️ Parti</button>
        </div>
        
        <!-- ACTIONS -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: flex-end;">
            <button class="btn btn-outline" onclick="exportToExcel()" style="padding: 6px 12px; font-size: 12px;">📊 Exporter Excel</button>
            <button class="btn btn-outline" onclick="chargerColis()" style="padding: 6px 12px; font-size: 12px;">🔄 Actualiser</button>
        </div>
        
        <!-- TABLEAU -->
        <div class="table-wrapper">
            <table class="colis-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Expéditeur</th>
                        <th>Destinataire</th>
                        <th>Type colis</th>
                        <th>Prix (€)</th>
                        <th>Statut</th>
                        <th>Date création</th>
                        <th>Date départ</th>
                        <th>Date récupération</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="11" class="text-center">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL RÉCUPÉRATION -->
<div id="modalRecup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 24px; width: 90%; max-width: 400px;">
        <div style="padding: 20px; border-bottom: 1px solid #e2e8f0;">
            <h3>🏠 RÉCUPÉRATION</h3>
        </div>
        <div style="padding: 20px;">
            <div class="form-group">
                <label>💰 Montant payé (€)</label>
                <input type="number" id="recupMontant" step="0.01" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:12px;">
            </div>
            <div class="form-group">
                <label>👤 Récupéré par</label>
                <input type="text" id="recupNom" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:12px;">
            </div>
        </div>
        <div style="padding: 15px 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; justify-content: flex-end;">
            <button onclick="fermerModal()" class="btn btn-secondary">Annuler</button>
            <button onclick="confirmerRecup()" class="btn btn-primary">Confirmer</button>
        </div>
    </div>
</div>

<style>
    .filter-btn {
        background: #f1f5f9;
        border: none;
        padding: 6px 16px;
        border-radius: 40px;
        font-size: 13px;
        cursor: pointer;
    }
    .filter-btn.active {
        background: #e67e22;
        color: white;
    }
    .type-badge-envoi {
        background: #dbeafe;
        color: #2563eb;
        padding: 4px 10px;
        border-radius: 40px;
        font-size: 11px;
        font-weight: 600;
        display: inline-block;
    }
    .type-badge-reception {
        background: #fef3c7;
        color: #d97706;
        padding: 4px 10px;
        border-radius: 40px;
        font-size: 11px;
        font-weight: 600;
        display: inline-block;
    }
    .action-btn {
        background: #e67e22;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
    }
    .action-btn:hover {
        background: #d35400;
    }
    .action-btn-disabled {
        background: #94a3b8;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        cursor: not-allowed;
        display: inline-block;
    }
    .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
    }
    .status-En-attente { background: #fef3c7; color: #d97706; }
    .status-Parti { background: #dbeafe; color: #2563eb; }
    .status-Récupéré { background: #d1fae5; color: #059669; }
</style>

<script>
    let colisData = [];
    let filtreActuel = 'all';
    let colisSelectionne = null;
    
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    }
    
    async function chargerColis() {
        const response = await fetch('/api/colis');
        colisData = await response.json();
        appliquerFiltreEtAfficher();
    }
    
    function appliquerFiltreEtAfficher() {
        let filtres = colisData;
        
        if (filtreActuel === 'envoi_france') {
            filtres = colisData.filter(c => c.type_flux === 'envoi_france');
        } else if (filtreActuel === 'reception_france') {
            filtres = colisData.filter(c => c.type_flux === 'reception_france');
        } else if (filtreActuel !== 'all') {
            filtres = colisData.filter(c => c.statut === filtreActuel);
        }
        
        const tbody = document.getElementById('tableBody');
        
        if (filtres.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11" class="text-center">Aucun colis trouvé</td></tr>';
            return;
        }
        
        tbody.innerHTML = filtres.map(c => {
            // Type de flux
            let typeHtml = '';
            if (c.type_flux === 'envoi_france') {
                typeHtml = '<span class="type-badge-envoi">📤 CI→FR</span>';
            } else {
                typeHtml = '<span class="type-badge-reception">📥 FR→CI</span>';
            }
            
            // Expéditeur
            let expediteur = c.deposant_nom || c.livreur_nom || '-';
            
            // Dates
            const dateCreation = formatDate(c.date_creation);
            
            // Date départ (seulement pour les envois)
            let dateDepart = '-';
            if (c.type_flux === 'envoi_france') {
                dateDepart = formatDate(c.date_expedition);
            }
            
            // Date récupération (seulement pour les réceptions)
            let dateRecuperation = '-';
            if (c.type_flux === 'reception_france') {
                dateRecuperation = formatDate(c.date_recuperation);
            }
            
            // Action
            let actionHtml = '';
            if (c.type_flux === 'reception_france' && c.statut === 'En attente') {
                actionHtml = `<button class="action-btn" onclick="ouvrirModalRecup(${c.id}, ${c.prix_final || 0})">🏠 Récupéré</button>`;
            } else if (c.type_flux === 'envoi_france' && c.statut === 'En attente') {
                actionHtml = `<button class="action-btn" onclick="marquerParti(${c.id})">✈️ Marquer Parti</button>`;
            } else if (c.statut === 'Récupéré') {
                actionHtml = `<span class="action-btn-disabled">✅ Récupéré${c.recuperateur_nom ? ' par ' + c.recuperateur_nom : ''}</span>`;
            } else if (c.statut === 'Parti') {
                actionHtml = `<span class="action-btn-disabled">✈️ Parti</span>`;
            } else {
                actionHtml = `<span class="action-btn-disabled">-</span>`;
            }
            
            return `
                <tr>
                    <td><strong>#${c.id}</strong></td>
                    <td>${typeHtml}</td>
                    <td><small>${expediteur}</small></td>
                    <td><small>${c.destinataire_nom || '-'}<br>📞 ${c.destinataire_telephone || '-'}</small></td>
                    <td><small>${c.type_colis || '-'}</small></td>
                    <td><strong>${c.prix_final || c.montant_paye || 0} €</strong></td>
                    <td><span class="status-badge status-${c.statut?.replace(/ /g, '-') || 'En-attente'}">${c.statut || 'En attente'}</span></td>
                    <td><small>${dateCreation}</small></td>
                    <td><small>${dateDepart}</small></td>
                    <td><small>${dateRecuperation}</small></td>
                    <td>${actionHtml}</td>
                </tr>
            `;
        }).join('');
    }
    
    async function marquerParti(id) {
        if (confirm('Confirmer que ce colis est parti vers la France ?')) {
            const response = await fetch(`/api/colis/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({statut: 'Parti'})
            });
            if (response.ok) chargerColis();
        }
    }
    
    function ouvrirModalRecup(id, montant) {
        colisSelectionne = id;
        document.getElementById('recupMontant').value = montant;
        document.getElementById('recupNom').value = '';
        document.getElementById('modalRecup').style.display = 'flex';
    }
    
    function fermerModal() {
        document.getElementById('modalRecup').style.display = 'none';
        colisSelectionne = null;
    }
    
    async function confirmerRecup() {
        const montant = parseFloat(document.getElementById('recupMontant').value);
        const nom = document.getElementById('recupNom').value;
        
        if (isNaN(montant) || montant <= 0) {
            alert('Veuillez entrer le montant payé');
            return;
        }
        
        const response = await fetch(`/api/colis/${colisSelectionne}/statut`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                statut: 'Récupéré',
                montant_paye: montant,
                recuperateur_nom: nom
            })
        });
        
        if (response.ok) {
            fermerModal();
            chargerColis();
        } else {
            alert('Erreur lors de la mise à jour');
        }
    }
    
    function exportToExcel() {
        let csv = "ID;Type;Expéditeur;Destinataire;Tél Destinataire;Type Colis;Prix;Statut;Date création;Date départ;Date récupération;Notes\n";
        colisData.forEach(c => {
            let dateDepart = (c.type_flux === 'envoi_france') ? formatDate(c.date_expedition) : '';
            let dateRecuperation = (c.type_flux === 'reception_france') ? formatDate(c.date_recuperation) : '';
            
            csv += `${c.id};`;
            csv += `${c.type_flux === 'envoi_france' ? 'CI→FR' : 'FR→CI'};`;
            csv += `${c.deposant_nom || c.livreur_nom || '-'};`;
            csv += `${c.destinataire_nom || '-'};`;
            csv += `${c.destinataire_telephone || '-'};`;
            csv += `${c.type_colis || '-'};`;
            csv += `${c.prix_final || c.montant_paye || 0};`;
            csv += `${c.statut};`;
            csv += `${formatDate(c.date_creation)};`;
            csv += `${dateDepart};`;
            csv += `${dateRecuperation};`;
            csv += `${c.notes || ''}\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv;charset=utf-8;'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `colis_export_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
    }
    
    // Filtres
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            filtreActuel = this.dataset.filter;
            appliquerFiltreEtAfficher();
        });
    });
    
    chargerColis();
</script>
{% endblock %}
